steps:
  # Build the Docker image with environment variables
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args: 
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/iancredible-portfolio'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyCqoKll_rAcRWJrO0SJ5pH7LK3-Ay_Juc8'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=iancredible-website.firebaseapp.com'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_PROJECT_ID=iancredible-website'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=iancredible-website.firebasestorage.app'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=796662323239'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_APP_ID=1:796662323239:web:4e7c185a08c0918f941602'
      - '--build-arg'
      - 'NEXT_PUBLIC_RECAPTCHA_SITE_KEY=6Lepb58sAAAAABbTXNBIneYDjOrMY6mtHFmRnNCo'
      - '--build-arg'
      - 'NEXT_PUBLIC_COSMIC_FLOW_URL=https://cosmic-flow-796662323239.us-central1.run.app'
      - '.'
    timeout: 3600s
    env:
      - 'DOCKER_BUILDKIT=1'

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args: ['push', 'gcr.io/$PROJECT_ID/iancredible-portfolio']

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/run'
    id: 'deploy'
    args: ['deploy', 'iancredible-portfolio', 
           '--image', 'gcr.io/$PROJECT_ID/iancredible-portfolio',
           '--region', 'us-central1',
           '--platform', 'managed',
           '--allow-unauthenticated',
           '--memory', '2Gi']

options:
  machineType: 'E2_HIGHCPU_8'

images:
  - 'gcr.io/$PROJECT_ID/iancredible-portfolio'

